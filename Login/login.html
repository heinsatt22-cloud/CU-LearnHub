<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CU LearnHub</title>
    <link href="" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }


        body {
            background-color: #f0f4f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Left Login Area */
        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #55c2f1 0%, #94f1a8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-shadow: 0 6px 26px rgba(0, 0, 0, 0.4);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .logo-box h2 {
            color: #1e293b;
            font-weight: 700;
        }

        .welcome-text h1 {
            font-size: 1.8rem;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .welcome-text p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 20px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #64748b;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        /* Right Image Area */
        .img {
            width: 50%;
            background: lightblue;
            display: flex;
            flex-direction: column;

        }

        img {
            position: sticky;
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }

        .overlay-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: white;
            max-width: 80%;
        }

        .overlay-content h2 {
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 800;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-left">
            <div class="login-card">
                <div class="logo-box">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                    <h2>CU LearnHub</h2>
                </div>

                <div class="welcome-text">
                    <h1>Welcome Back!</h1>
                    <p>Log in to continue your learning journey</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" placeholder="Enter your name" id="userName">
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" placeholder="Enter your email" id="userEmail">
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="rem">
                        <label for="rem">Remember Me</label>
                    </div>

                    <button type="submit" class="login-btn">Login</button>
                </form>
            </div>
        </div>


        <div class="img">
            <img src="Education.jpg">
        </div>

    </div>


    <script>
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();


            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;


            if (name === "Student1" && email === "Student1@gmail.com") {


                alert('Welcome, ' + name + '! Redirecting to CU LearnHub Home Page...');

                window.location.href = './Home/home.html';

            } else {
                alert('Please fill in all fields!');
            }
        });
    </script>


</body>

</html>
